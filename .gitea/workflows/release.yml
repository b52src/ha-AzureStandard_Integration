name: Release on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          # Pull the section for this version out of CHANGELOG.md
          VERSION="${{ steps.version.outputs.VERSION }}"
          BODY=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md \
                | head -n -1 \
                | tail -n +2)
          # Escape for multiline env var
          EOF=$(openssl rand -hex 8)
          echo "BODY<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY"      >> "$GITHUB_OUTPUT"
          echo "$EOF"       >> "$GITHUB_OUTPUT"

      - name: Create Forgejo release
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          AUTH="-H \"Authorization: token ${FORGEJO_TOKEN}\""

          # Delete existing release for this tag if present (idempotent re-runs)
          EXISTING_ID=$(curl -sf \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${API}/releases/tags/${TAG}" 2>/dev/null | jq -r '.id // empty')
          if [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing release id=${EXISTING_ID} for tag ${TAG}"
            curl -sf -X DELETE \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              "${API}/releases/${EXISTING_ID}"
          fi

          # Create the new release
          PAYLOAD="$(jq -n \
            --arg tag  "$TAG" \
            --arg name "$TAG" \
            --arg body "${{ steps.changelog.outputs.BODY }}" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')"
          RESPONSE="$(curl -s -w '\nHTTP_STATUS:%{http_code}' -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/releases" \
            -d "$PAYLOAD")"
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | grep 'HTTP_STATUS:' | cut -d: -f2)
          if [ "$HTTP_CODE" != "201" ]; then
            echo "Release creation failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Release ${TAG} created successfully."
