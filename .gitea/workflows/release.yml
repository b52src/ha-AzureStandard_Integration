name: Release on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          # Pull the section for this version out of CHANGELOG.md
          VERSION="${{ steps.version.outputs.VERSION }}"
          BODY=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md \
                | head -n -1 \
                | tail -n +2)
          # Escape for multiline env var
          EOF=$(openssl rand -hex 8)
          echo "BODY<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY"      >> "$GITHUB_OUTPUT"
          echo "$EOF"       >> "$GITHUB_OUTPUT"

      - name: Create Forgejo release
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -d "$(jq -n \
              --arg tag  "${{ github.ref_name }}" \
              --arg name "${{ github.ref_name }}" \
              --arg body "${{ steps.changelog.outputs.BODY }}" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')"
